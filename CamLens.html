<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CamViz · запити на відео</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c111d;
            background-image: radial-gradient(circle at 15% 30%, #1a2a3f 0%, #0a0f1a 90%);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            color: #eef4ff;
        }

        .camera-dashboard {
            max-width: 1300px;
            width: 100%;
            background: rgba(10, 20, 35, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(64, 128, 255, 0.25);
            border-radius: clamp(20px, 5vw, 64px);
            padding: clamp(12px, 4vw, 40px);
            box-shadow: 0 40px 80px -20px #00000080, 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
        }

        .header-cam {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(20px, 5vw, 40px);
            gap: 15px;
            flex-wrap: wrap;
        }

        .title-block h1 {
            font-size: clamp(1.2rem, 5vw, 2.8rem);
            font-weight: 700;
            background: linear-gradient(135deg, #b3e0ff, #7aaaff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .title-block h1 i {
            font-size: 1em;
            color: #3b82f6;
            text-shadow: 0 0 20px #3b82f6;
        }

        .title-block div {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .title-block div span {
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            padding: 4px 12px;
        }

        .badge-cam {
            background: rgba(0, 200, 255, 0.1);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: 600;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            color: #a0e0ff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .year-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: clamp(8px, 2vw, 18px);
            margin-bottom: clamp(25px, 5vw, 50px);
        }

        .year-card {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(10px);
            border-radius: clamp(16px, 4vw, 34px);
            padding: clamp(12px, 3vw, 24px) clamp(8px, 2vw, 16px);
            border: 1px solid rgba(0, 160, 255, 0.3);
            text-align: center;
            transition: transform 0.2s;
        }

        .year-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 0 30px #0055ff60;
        }

        .year-card.year-current {
            background: rgba(30, 80, 140, 0.5);
            border: 2px solid #fbbf24;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.15);
            position: relative;
        }

        .year-card.year-current::after {
            content: "● поточний";
            position: absolute;
            top: -8px;
            right: -8px;
            background: #fbbf24;
            color: #0c111d;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .year-card.year-war {
            border: 2px solid #dc2626;
            background: rgba(40, 10, 10, 0.5);
        }

        .year-card.year-current .year-value {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .year-card.year-current .year-label {
            color: #fbbf24;
            border-top-color: #fbbf2440;
        }

        .year-card.year-war .year-value {
            background: linear-gradient(145deg, #f87171, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .year-value {
            font-size: clamp(1.2rem, 4vw, 3.2rem);
            font-weight: 700;
            line-height: 1.2;
            background: linear-gradient(145deg, #ffffff, #b3d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .year-label {
            font-size: clamp(0.7rem, 2vw, 1.1rem);
            font-weight: 600;
            color: #8fb7e0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-top: 1px dashed #2a4b70;
            padding-top: 8px;
            margin-top: 4px;
        }

        .insight-panel {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: clamp(15px, 3vw, 28px);
            margin-bottom: clamp(25px, 5vw, 40px);
        }

        .chart-area {
            background: rgba(8, 18, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: clamp(24px, 5vw, 48px);
            padding: clamp(16px, 3vw, 28px);
            border: 1px solid #2f5170;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chart-header h3 {
            font-size: clamp(0.9rem, 2.5vw, 1.6rem);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-header h3 i {
            padding: 6px;
            font-size: clamp(0.8rem, 2vw, 1.3rem);
        }

        .chart-wrapper {
            position: relative;
            height: 0;
            padding-bottom: 60%;
            min-height: 150px;
            max-height: 300px;
            width: 100%;
        }

        .chart-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .stats-breakdown {
            background: rgba(8, 18, 32, 0.7);
            backdrop-filter: blur(12px);
            border-radius: clamp(24px, 5vw, 48px);
            padding: clamp(16px, 3vw, 28px);
            border: 1px solid #2f5170;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .total-requests {
            background: linear-gradient(145deg, #142b44, #0a1a2e);
            border-radius: clamp(20px, 4vw, 36px);
            padding: clamp(16px, 3vw, 24px);
            border: 1px solid #3c6990;
        }

        .total-number {
            font-size: clamp(2rem, 6vw, 4.2rem);
            font-weight: 700;
            background: linear-gradient(145deg, #fff, #b1d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin: 5px 0;
        }

        .stat-bar {
            flex: 1;
            height: 8px;
            background: #1e3a5a;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 8px;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            box-shadow: 0 0 10px #3b82f6;
            width: 0%;
            transition: width 1.5s ease-in-out;
            border-radius: 20px;
        }

        .stat-fill.current {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            box-shadow: 0 0 15px #fbbf24;
        }

        .stat-fill.war {
            background: linear-gradient(90deg, #dc2626, #991b1b);
            box-shadow: 0 0 15px #dc262660;
        }

        .feature-footer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(15px, 3vw, 28px);
            margin-top: 20px;
        }

        .insight-card {
            background: rgba(12, 24, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: clamp(24px, 5vw, 38px);
            padding: clamp(16px, 3vw, 26px);
            border: 1px solid #345d84;
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 24px);
        }

        .insight-card.war-card {
            border-color: #dc262660;
            background: rgba(40, 10, 10, 0.6);
        }

        .icon-large {
            min-width: 50px;
            width: clamp(50px, 8vw, 70px);
            height: clamp(50px, 8vw, 70px);
            background: #152f4a;
            border-radius: clamp(16px, 4vw, 30px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #5aa9ff;
            border: 1px solid #3d7bb3;
            flex-shrink: 0;
        }

        .icon-large.war-icon {
            background: #2a1010;
            border-color: #dc2626;
            color: #dc2626;
        }

        .insight-card h4 {
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            margin-bottom: 4px;
        }

        .insight-card p {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #9fb9d4;
        }

        .insight-card.war-card h4 {
            color: #f87171;
        }

        .insight-card.war-card p {
            color: #d4a0a0;
        }

        .status-message {
            text-align: center;
            padding: 60px 20px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: #8fb7e0;
        }

        .status-message.error {
            color: #f87171;
        }

        .status-message code {
            background: #152f4a;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.85em;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 900px) {
            .insight-panel {
                grid-template-columns: 1fr;
            }
            .chart-wrapper {
                padding-bottom: 55%;
            }
        }

        @media (max-width: 700px) {
            .feature-footer {
                grid-template-columns: 1fr;
            }
            .header-cam {
                flex-direction: column;
                align-items: flex-start;
            }
            .badge-cam {
                width: 100%;
                justify-content: center;
                white-space: normal;
                text-align: center;
            }
        }

        @media (max-width: 600px) {
            .chart-wrapper {
                padding-bottom: 50%;
            }
            .title-block div {
                justify-content: center;
            }
        }

        @media (max-width: 450px) {
            .year-card {
                padding: 10px 5px;
            }
            .year-value {
                font-size: 1.2rem;
            }
            .year-label {
                font-size: 0.7rem;
            }
            .chart-wrapper {
                padding-bottom: 45%;
            }
            .insight-card {
                flex-direction: column;
                text-align: center;
            }
            .year-card.year-current::after {
                font-size: 0.45rem;
                top: -6px;
                right: -6px;
                padding: 1px 8px;
            }
        }

        @media (max-width: 350px) {
            .year-stats {
                grid-template-columns: 1fr;
            }
            .year-value {
                font-size: 1.4rem;
            }
            .badge-cam {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
            .total-number {
                font-size: 2rem;
            }
            .chart-wrapper {
                padding-bottom: 40%;
            }
        }

        #statBars > div {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }

        @media (max-width: 500px) {
            #statBars > div {
                flex-wrap: wrap;
            }
            .stat-bar {
                flex-basis: 100%;
                order: 3;
                margin: 5px 0 0 0;
            }
            #statBars span:last-child {
                margin-left: auto;
            }
        }
    </style>
</head>
<body>

<div id="statusScreen" class="camera-dashboard">
    <div class="status-message" id="statusText">
        <i class="fas fa-spinner fa-spin"></i> Завантаження даних з Google Таблиці...
    </div>
</div>

<div class="camera-dashboard hidden" id="dashboard">

    <div class="header-cam">
        <div class="title-block">
            <h1><i class="fas fa-video"></i> Звернення до Ситуаційного центру</h1>
            <div id="headerBadges">
                <!-- заповнюється скриптом -->
            </div>
        </div>
        <div class="badge-cam" id="topBadge">
            <i class="fas fa-circle" style="font-size: 0.7rem; color: #fbbf24;"></i> <span id="topBadgeText"></span>
        </div>
    </div>

    <div class="year-stats" id="yearStats">
        <!-- заповнюється скриптом -->
    </div>

    <div class="insight-panel">
        <div class="chart-area">
            <div class="chart-header">
                <h3><i class="fas fa-chart-bar" style="background:#1e3b5a; padding:8px; border-radius:16px; color:#38bdf8;"></i> Динаміка запитів</h3>
                <span style="background:#1e3a5f; border-radius:60px; padding:6px 16px; color:#9ac8ff; border:1px solid #3482cc; font-size:clamp(0.7rem,2vw,0.9rem);" id="cagrBadge"></span>
            </div>
            <div class="chart-wrapper">
                <canvas id="videoRequestsChart"></canvas>
            </div>
        </div>

        <div class="stats-breakdown">
            <div class="total-requests">
                <div style="color:#88b9e6; text-transform:uppercase; letter-spacing:1px; font-size: clamp(0.7rem,2vw,0.9rem);">загальна кількість</div>
                <div class="total-number" id="totalNumber">0</div>
                <div style="color:#b0d4f0; font-size:clamp(0.7rem,2vw,0.9rem);" id="totalGrowth"></div>
            </div>
            <div id="statBars"></div>
            <div style="background:#0f1e30; border-radius: 24px; padding: 16px; border:1px solid #fbbf2460;" id="currentBox">
                <!-- заповнюється скриптом -->
            </div>
        </div>
    </div>

    <div class="feature-footer" id="featureFooter">
        <!-- заповнюється скриптом -->
    </div>
</div>

<script>
(function() {
    // ==========================================================
    // НАЛАШТУВАННЯ: вставте сюди ID вашої Google Таблиці
    // ID береться з адресного рядка: .../spreadsheets/d/ЦЕЙ_ID/edit
    // Таблиця має бути відкрита на перегляд ("Усі, у кого є посилання")
    // ==========================================================
    const SHEET_ID = '1M6yCm3g18A7zxMt5H5rgGcav0EYm2FQ3G1wewkj6Jqk';
    const SHEET_NAME = 'Аркуш1'; // назва листа з колонками Year, Requests, Highlight, Note


    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const statusScreen = document.getElementById('statusScreen');
    const statusText = document.getElementById('statusText');
    const dashboard = document.getElementById('dashboard');

    function showError(msg) {
        statusText.innerHTML = `<i class="fas fa-triangle-exclamation"></i> ${msg}`;
        statusScreen.querySelector('.status-message').classList.add('error');
    }

    if (!SHEET_ID || SHEET_ID.indexOf('ВСТАВТЕ') === 0) {
        showError('Вкажіть SHEET_ID у коді сторінки (на початку тега &lt;script&gt;), щоб підʼєднати вашу Google Таблицю.');
        return;
    }

    fetch(CSV_URL)
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(csvText => {
            const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
            const rows = parsed.data
                .map(r => ({
                    year: (r.Year || '').toString().trim(),
                    requests: Number((r.Requests || '0').toString().replace(/\s/g, '').replace(',', '.')) || 0,
                    highlight: (r.Highlight || '').toString().trim().toLowerCase(),
                    note: (r.Note || '').toString().trim()
                }))
                .filter(r => r.year !== '')
                .sort((a, b) => a.year.localeCompare(b.year, undefined, {numeric: true}));

            if (rows.length === 0) {
                showError('У таблиці не знайдено рядків з даними. Перевірте назви колонок: Year, Requests, Highlight, Note.');
                return;
            }

            renderDashboard(rows);
            statusScreen.classList.add('hidden');
            dashboard.classList.remove('hidden');
        })
        .catch(err => {
            showError('Не вдалося завантажити таблицю. Перевірте, що доступ відкрито "Усім, у кого є посилання" і що SHEET_ID та назва листа вказані вірно. (' + err.message + ')');
        });

    function renderDashboard(rows) {
        const years = rows.map(r => r.year);
        const requests = rows.map(r => r.requests);

        // Автовизначення поточного року, якщо не вказано вручну
        let currentIdx = rows.findIndex(r => r.highlight === 'current');
        if (currentIdx === -1) currentIdx = rows.length - 1;

        const warIdx = rows.findIndex(r => r.highlight === 'war' || r.highlight === 'alert');

        const total = requests.reduce((a, b) => a + b, 0);
        const first = requests[0];
        const last = requests[requests.length - 1];
        const growthPct = first > 0 ? Math.round(((last - first) / first) * 100) : 0;
        const n = requests.length;
        const cagr = (first > 0 && n > 1) ? (Math.pow(last / first, 1 / (n - 1)) - 1) * 100 : 0;

        // Порівняння поточного року з попереднім (для великої цифри "загальна кількість")
        const prevYearVal = currentIdx > 0 ? requests[currentIdx - 1] : null;
        const yoyPct = prevYearVal ? Math.round(((requests[currentIdx] - prevYearVal) / prevYearVal) * 100) : null;

        // Заголовок / бейджі
        document.getElementById('headerBadges').innerHTML = `
            <span style="background: #113355; border-radius: 40px; border:1px solid #2266aa;"><i class="fas fa-database"></i> архів ${years[0]}–${years[years.length-1]}</span>
            <span style="background: #113355; border-radius: 40px; border:1px solid #aa22aa;"><i class="fas fa-chart-line"></i> ${growthPct >= 0 ? '+' : ''}${growthPct}% з ${years[0]}</span>
            <span style="background: #1a3a2a; border-radius: 40px; border:1px solid #fbbf24; color: #fbbf24;"><i class="fas fa-calendar-alt"></i> ${years[currentIdx]} триває</span>
        `;
        document.getElementById('topBadgeText').textContent = `${requests[currentIdx]} запитів · ${years[currentIdx]}`;

        // Картки по роках
        const yearStatsEl = document.getElementById('yearStats');
        yearStatsEl.innerHTML = rows.map((r, i) => {
            let cls = 'year-card';
            let badge = '';
            if (i === currentIdx) { cls += ' year-current'; }
            else if (i === warIdx) { cls += ' year-war'; }
            return `<div class="${cls}"><div class="year-value">${r.requests}</div><div class="year-label"><i class="fas fa-calendar"></i>${r.year}</div></div>`;
        }).join('');

        // Анімація чисел
        yearStatsEl.querySelectorAll('.year-value').forEach((el, i) => {
            const target = requests[i];
            let count = 0;
            const step = Math.max(1, Math.ceil(target / 50));
            const update = () => {
                count += step;
                if (count < target) {
                    el.innerText = Math.floor(count);
                    requestAnimationFrame(() => setTimeout(update, 16));
                } else {
                    el.innerText = target;
                }
            };
            update();
        });

        document.getElementById('cagrBadge').textContent = `CAGR ${cagr >= 0 ? '+' : ''}${cagr.toFixed(0)}%`;
        document.getElementById('totalNumber').textContent = total.toLocaleString('uk-UA');
        if (yoyPct !== null) {
            document.getElementById('totalGrowth').innerHTML = `<i class="fas fa-arrow-${yoyPct >= 0 ? 'up' : 'down'}" style="color:${yoyPct >= 0 ? '#10b981' : '#dc2626'};"></i> ${yoyPct >= 0 ? '+' : ''}${yoyPct}% vs ${years[currentIdx - 1]}`;
        } else {
            document.getElementById('totalGrowth').innerHTML = '';
        }

        // Блок "поточний рік"
        const prevVal = currentIdx > 0 ? requests[currentIdx - 1] : null;
        const pctOfPrev = prevVal ? Math.round((requests[currentIdx] / prevVal) * 100) : null;
        const today = new Date().toLocaleDateString('uk-UA');
        document.getElementById('currentBox').innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                <span style="font-size:clamp(0.7rem,2vw,0.9rem);"><i class="fas fa-calendar-check" style="color:#fbbf24;"></i> ${years[currentIdx]} (поточний)</span>
                <span style="font-weight:700; font-size: clamp(1.2rem,4vw,1.6rem); color: #fbbf24;">${requests[currentIdx]}</span>
            </div>
            <div style="height: 6px; background:#1b3a5c; border-radius:10px; margin-top:10px;">
                <div style="width:${pctOfPrev ? Math.min(pctOfPrev, 100) : 100}%; height:6px; background: linear-gradient(90deg,#fbbf24,#f59e0b); border-radius:10px; box-shadow: 0 0 15px #fbbf2460;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:#6a8aa8; margin-top:4px;">
                <span>станом на ${today}</span>
                ${pctOfPrev ? `<span>${pctOfPrev}% від ${years[currentIdx - 1]}</span>` : ''}
            </div>
        `;

        // Прогрес-бари
        const maxVal = Math.max(...requests);
        const container = document.getElementById('statBars');
        container.innerHTML = rows.map((r, i) => {
            const pct = maxVal > 0 ? (r.requests / maxVal) * 100 : 0;
            let colorStyle = '';
            let fillClass = '';
            if (i === currentIdx) { colorStyle = 'color:#fbbf24;'; fillClass = 'current'; }
            else if (i === warIdx) { colorStyle = 'color:#f87171;'; fillClass = 'war'; }
            return `
                <div>
                    <span style="min-width:45px; font-weight:700; font-size:clamp(0.7rem,2vw,0.9rem); ${colorStyle}">${r.year}</span>
                    <div class="stat-bar"><div class="stat-fill ${fillClass}" style="width:${pct}%"></div></div>
                    <span style="min-width:45px; text-align:right; font-size:clamp(0.7rem,2vw,0.9rem); ${colorStyle}">${r.requests}</span>
                </div>`;
        }).join('');

        // Нижні картки-інсайти
        const footerCards = [];
        if (warIdx !== -1) {
            const r = rows[warIdx];
            footerCards.push(`
                <div class="insight-card war-card">
                    <div class="icon-large war-icon"><i class="fas fa-shield-halved"></i></div>
                    <div>
                        <h4>${r.note ? r.note.split('·')[0].trim() : 'Провал'} · ${r.year}</h4>
                        <p>${r.requests} запитів</p>
                        ${r.note ? `<p style="font-size:0.75rem; color:#b08080; margin-top:4px;">${r.note}</p>` : ''}
                    </div>
                </div>`);
        }
        footerCards.push(`
            <div class="insight-card" style="border-color: #fbbf2450;">
                <div class="icon-large" style="border-color: #fbbf24; color: #fbbf24;"><i class="fas fa-clock"></i></div>
                <div>
                    <h4 style="color: #fbbf24;">${years[currentIdx]} триває</h4>
                    <p>${requests[currentIdx]} запитів</p>
                </div>
            </div>`);
        document.getElementById('featureFooter').innerHTML = footerCards.join('');

        // Графік
        const ctx = document.getElementById('videoRequestsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: years,
                datasets: [{
                    data: requests,
                    backgroundColor: rows.map((r, i) => i === currentIdx ? '#fbbf24' : (i === warIdx ? '#dc2626' : '#3b82f6')),
                    borderRadius: 8,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1e3347',
                        callbacks: {
                            label: function(context) { return context.parsed.y + ' запитів'; }
                        }
                    }
                },
                scales: {
                    y: {
                        grid: { color: '#1f405e' },
                        ticks: { color: '#9bc9ff', font: { size: window.innerWidth < 500 ? 8 : 10 } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#b3d6ff', font: { size: window.innerWidth < 500 ? 8 : 10 }, maxRotation: 45, minRotation: 30 }
                    }
                }
            }
        });

        window.addEventListener('resize', () => {
            const fontSize = window.innerWidth < 500 ? 8 : 10;
            chart.options.scales.y.ticks.font = { size: fontSize };
            chart.options.scales.x.ticks.font = { size: fontSize };
            chart.update();
        });
    }
})();
</script>
</body>
</html>
